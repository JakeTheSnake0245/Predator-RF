<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Predator RF Map</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body, #map {
            height: 100%;
            width: 100%;
            background: #0b0e0a;
            overflow: hidden;
        }

        .maplibregl-canvas-container { background: #0b0e0a; }

        .maplibregl-ctrl-attrib {
            background: rgba(12, 16, 11, 0.85) !important;
            color: #7a9e7e !important;
            font-size: 10px !important;
        }
        .maplibregl-ctrl-attrib a { color: #83d099 !important; }

        /* ── Style MapLibre's built-in nav controls ── */
        .maplibregl-ctrl-group {
            background: rgba(11, 14, 10, 0.92) !important;
            border: 1px solid rgba(131, 208, 153, 0.25) !important;
            border-radius: 8px !important;
            box-shadow: none !important;
        }
        .maplibregl-ctrl-group button {
            background: transparent !important;
            border-bottom: 1px solid rgba(131, 208, 153, 0.12) !important;
        }
        .maplibregl-ctrl-group button:last-child { border-bottom: none !important; }
        .maplibregl-ctrl-group button:hover { background: rgba(131, 208, 153, 0.1) !important; }
        .maplibregl-ctrl-icon { filter: invert(60%) sepia(20%) saturate(400%) hue-rotate(90deg); }
        .maplibregl-ctrl-scale {
            background: rgba(11, 14, 10, 0.85) !important;
            border-color: rgba(131, 208, 153, 0.35) !important;
            color: #7a9e7e !important;
            font-size: 10px !important;
        }

        /* ── Right control panel ── */
        #control-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            user-select: none;
            /* Scroll vertically if the iframe is too short to show all rows */
            max-height: calc(100% - 24px);
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: rgba(131,208,153,0.3) transparent;
        }

        .ctrl-section {
            background: rgba(11, 14, 10, 0.92);
            border: 1px solid rgba(131, 208, 153, 0.25);
            border-radius: 8px;
            overflow: hidden;
        }

        .ctrl-section-title {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #d8c96a;
            padding: 5px 10px 3px;
            border-bottom: 1px solid rgba(131, 208, 153, 0.15);
        }

        #view-toggle {
            display: flex;
            background: rgba(11, 14, 10, 0.92);
            border: 1px solid rgba(131, 208, 153, 0.25);
            border-radius: 8px;
            overflow: hidden;
        }

        .view-btn {
            flex: 1;
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #7a9e7e;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .view-btn.active { background: rgba(131, 208, 153, 0.18); color: #83d099; }
        .view-btn:first-child { border-right: 1px solid rgba(131, 208, 153, 0.2); }

        .layer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            gap: 16px;
            border-bottom: 1px solid rgba(131, 208, 153, 0.08);
        }
        .layer-row:last-child { border-bottom: none; }

        .layer-label {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: 600;
            color: #b0c8b4;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .toggle-switch {
            position: relative;
            width: 34px;
            height: 18px;
            flex-shrink: 0;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }
        .toggle-track {
            position: absolute;
            inset: 0;
            background: rgba(131, 208, 153, 0.12);
            border: 1px solid rgba(131, 208, 153, 0.3);
            border-radius: 18px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .toggle-track::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4a6a4e;
            top: 2px;
            left: 2px;
            transition: transform 0.2s, background 0.2s;
        }
        .toggle-switch input:checked + .toggle-track {
            background: rgba(131, 208, 153, 0.28);
            border-color: #83d099;
        }
        .toggle-switch input:checked + .toggle-track::after {
            transform: translateX(16px);
            background: #83d099;
        }
        .toggle-switch.buildings input:checked + .toggle-track {
            background: rgba(216, 201, 106, 0.22);
            border-color: #d8c96a;
        }
        .toggle-switch.buildings input:checked + .toggle-track::after { background: #d8c96a; }

        /* ── Compass button ── */
        #compass-btn {
            position: absolute;
            bottom: 120px;
            left: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #compass-ring {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(11, 14, 10, 0.92);
            border: 1px solid rgba(131, 208, 153, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #compass-btn.rotated #compass-ring {
            border-color: #d8c96a;
            box-shadow: 0 0 10px rgba(216, 201, 106, 0.25);
        }

        #compass-needle {
            transition: transform 0.15s linear;
        }

        #compass-label {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #4a6a4e;
            text-align: center;
            transition: color 0.3s;
        }

        #compass-btn.rotated #compass-label {
            color: #d8c96a;
        }

        #compass-bearing {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: 700;
            color: #7a9e7e;
            letter-spacing: 0.05em;
            min-width: 36px;
            text-align: center;
            transition: color 0.3s;
        }

        #compass-btn.rotated #compass-bearing {
            color: #d8c96a;
        }

        /* Pulse ring when snapping to north */
        @keyframes snap-pulse {
            0%   { transform: scale(1);   opacity: 0.8; }
            60%  { transform: scale(1.25); opacity: 0.3; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .snap-pulse-ring {
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid #83d099;
            animation: snap-pulse 0.5s ease-out forwards;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Right panel -->
    <div id="control-panel">
        <div id="view-toggle">
            <button class="view-btn active" id="btn-2d" onclick="setView2D()">2D</button>
            <button class="view-btn" id="btn-3d" onclick="setView3D()">3D</button>
        </div>

        <div class="ctrl-section">
            <div class="ctrl-section-title">Layers</div>
            <div class="layer-row">
                <span class="layer-label">Road Names</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-road-names" checked onchange="toggleLayerGroup('roadNames', this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>
            <div class="layer-row">
                <span class="layer-label">Businesses</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-pois" checked onchange="toggleLayerGroup('pois', this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>
            <div class="layer-row">
                <span class="layer-label">Railways</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-railways" checked onchange="toggleLayerGroup('railways', this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>
            <div class="layer-row">
                <span class="layer-label">Roads</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-roads" checked onchange="toggleLayerGroup('roads', this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>
        </div>

        <div class="ctrl-section">
            <div class="ctrl-section-title">DF / LOB</div>
            <div class="layer-row">
                <span class="layer-label">LOB Wedges</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-lob-wedges" checked onchange="toggleLOBLayers(this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>
            <div class="layer-row">
                <span class="layer-label">LOB Crosscut</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-lob-crosscut" checked onchange="toggleLOBCrosscut(this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>
        </div>

        <div class="ctrl-section">
            <div class="ctrl-section-title">3D</div>
            <div class="layer-row">
                <span class="layer-label">Elevation</span>
                <label class="toggle-switch buildings">
                    <input type="checkbox" id="toggle-terrain" onchange="toggleTerrain(this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>
            <div class="layer-row">
                <span class="layer-label">Buildings</span>
                <label class="toggle-switch buildings">
                    <input type="checkbox" id="toggle-buildings" onchange="toggle3DBuildings(this.checked)">
                    <span class="toggle-track"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Compass button (bottom-left) -->
    <div id="compass-btn" onclick="snapNorth()" title="Tap to lock north">
        <div id="compass-ring">
            <svg id="compass-needle" viewBox="0 0 32 32" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
                <!-- Cardinal tick marks -->
                <line x1="16" y1="2"  x2="16" y2="5"  stroke="rgba(131,208,153,0.4)" stroke-width="1.2"/>
                <line x1="16" y1="27" x2="16" y2="30" stroke="rgba(131,208,153,0.2)" stroke-width="1"/>
                <line x1="2"  y1="16" x2="5"  y2="16" stroke="rgba(131,208,153,0.2)" stroke-width="1"/>
                <line x1="27" y1="16" x2="30" y2="16" stroke="rgba(131,208,153,0.2)" stroke-width="1"/>
                <!-- North arrow (gold) -->
                <polygon points="16,3 18.2,14 16,12.5 13.8,14" fill="#d8c96a"/>
                <!-- South arrow (muted green) -->
                <polygon points="16,29 18.2,18 16,19.5 13.8,18" fill="#3a5240"/>
                <!-- Center hub -->
                <circle cx="16" cy="16" r="2.5" fill="#0b0e0a" stroke="rgba(131,208,153,0.5)" stroke-width="1"/>
            </svg>
        </div>
        <div id="compass-bearing">000°</div>
        <div id="compass-label">NORTH</div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
    <script>
        const INIT_CENTER = [-77.0369, 38.9072];
        const INIT_ZOOM   = 10;

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/dark',
            center: INIT_CENTER,
            zoom: INIT_ZOOM,
            pitch: 0,
            bearing: 0,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showCompass: false }), 'bottom-right');
        map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

        /* ── Compass logic ── */
        const compassBtn     = document.getElementById('compass-btn');
        const compassNeedle  = document.getElementById('compass-needle');
        const compassBearing = document.getElementById('compass-bearing');
        const compassLabel   = document.getElementById('compass-label');

        function updateCompass() {
            const bearing = map.getBearing();
            const rounded = Math.round(((bearing % 360) + 360) % 360);

            compassNeedle.style.transform = `rotate(${-bearing}deg)`;
            compassBearing.textContent = String(rounded).padStart(3, '0') + '°';

            const isNorth = rounded === 0 || rounded === 360;
            if (isNorth) {
                compassBtn.classList.remove('rotated');
                compassLabel.textContent = 'NORTH';
            } else {
                compassBtn.classList.add('rotated');
                compassLabel.textContent = 'LOCK N';
            }
        }

        function snapNorth() {
            const bearing = map.getBearing();
            if (Math.abs(bearing) < 0.5) return;

            map.easeTo({ bearing: 0, duration: 500 });

            const ring = document.getElementById('compass-ring');
            const pulse = document.createElement('div');
            pulse.className = 'snap-pulse-ring';
            ring.appendChild(pulse);
            pulse.addEventListener('animationend', () => pulse.remove());
        }

        map.on('rotate', updateCompass);
        map.on('rotateend', updateCompass);
        updateCompass();

        /* ── Layer group registry ── */
        const layerGroups = {
            roadNames: [],
            pois:      [],
            railways:  [],
            roads:     []
        };

        let styleReady = false;

        function discoverLayers() {
            const layers = map.getStyle().layers;
            layers.forEach(layer => {
                const id   = layer.id.toLowerCase();
                const type = layer.type;

                const isLabel   = type === 'symbol';
                const isLine    = type === 'line';
                const isRailKw  = id.includes('rail');
                const isRoadKw  = id.includes('road') || id.includes('highway') ||
                                  id.includes('motorway') || id.includes('trunk') ||
                                  id.includes('primary') || id.includes('secondary') ||
                                  id.includes('tertiary') || id.includes('street') ||
                                  id.includes('link') || id.includes('path') ||
                                  id.includes('track') || id.includes('service') ||
                                  id.includes('bridge') || id.includes('tunnel') ||
                                  id.includes('transportation');
                const isPoiKw   = id.includes('poi') || id.includes('shop') ||
                                  id.includes('amenity') || id.includes('place') ||
                                  id.includes('landuse') || id.includes('business');
                const isLabelKw = id.includes('label') || id.includes('name') || id.includes('text');

                if (isRailKw && isLine) {
                    layerGroups.railways.push(layer.id);
                } else if (isRailKw && isLabel) {
                    layerGroups.roadNames.push(layer.id);
                } else if (isRoadKw && isLabel && isLabelKw) {
                    layerGroups.roadNames.push(layer.id);
                } else if (isRoadKw && isLine) {
                    layerGroups.roads.push(layer.id);
                } else if (isPoiKw && isLabel) {
                    layerGroups.pois.push(layer.id);
                } else if (isPoiKw && !isRailKw && !isRoadKw) {
                    layerGroups.pois.push(layer.id);
                }
            });
        }

        function toggleLayerGroup(group, visible) {
            if (!styleReady) return;
            const ids = layerGroups[group] || [];
            const vis = visible ? 'visible' : 'none';
            ids.forEach(id => {
                try { map.setLayoutProperty(id, 'visibility', vis); } catch(e) {}
            });
        }

        /* ── 3D buildings ── */
        function add3DBuildingLayer() {
            const sources = map.getStyle().sources;
            const sourceName = Object.keys(sources).find(k =>
                sources[k].type === 'vector' &&
                (k.includes('openmaptiles') || k.includes('openfreemap') ||
                 k === 'maptiler_planet' || k === 'v3' || k === 'tiles')
            ) || Object.keys(sources).find(k => sources[k].type === 'vector');

            if (!sourceName) return;

            map.addLayer({
                id: '_predator_3d_buildings',
                source: sourceName,
                'source-layer': 'building',
                type: 'fill-extrusion',
                minzoom: 14,
                paint: {
                    'fill-extrusion-color': [
                        'interpolate', ['linear'], ['zoom'],
                        14, '#1a2420',
                        17, '#243028'
                    ],
                    'fill-extrusion-height': [
                        'coalesce',
                        ['get', 'render_height'],
                        ['get', 'height'],
                        10
                    ],
                    'fill-extrusion-base': [
                        'coalesce',
                        ['get', 'render_min_height'],
                        ['get', 'min_height'],
                        0
                    ],
                    'fill-extrusion-opacity': 0.85
                },
                layout: { visibility: 'none' }
            });
        }

        function toggle3DBuildings(visible) {
            if (!styleReady) return;
            try {
                map.setLayoutProperty('_predator_3d_buildings', 'visibility', visible ? 'visible' : 'none');
            } catch(e) {}
        }

        /* ── Terrain / elevation ── */
        let terrainEnabled = false;

        function addTerrain() {
            // AWS Terrain RGB (Terrarium encoding) — free, no API key.
            // Provides ~30 m global elevation resolution up to zoom 15.
            map.addSource('_terrain_dem', {
                type: 'raster-dem',
                tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
                encoding: 'terrarium',
                tileSize: 256,
                maxzoom: 15,
                attribution: '© Mapzen/Amazon elevation'
            });

            // Hillshade layer — subtle tactical shading visible in 2D as well
            // as adding depth cues in 3D. Inserted below roads so it doesn't
            // occlude labels.
            const firstSymbolId = map.getStyle().layers
                .find(l => l.type === 'symbol')?.id;
            map.addLayer({
                id: '_hillshade',
                type: 'hillshade',
                source: '_terrain_dem',
                layout: { visibility: 'none' },
                paint: {
                    'hillshade-shadow-color':   '#0a130a',
                    'hillshade-highlight-color':'#1a3020',
                    'hillshade-accent-color':   '#0d1a0d',
                    'hillshade-illumination-direction': 315,
                    'hillshade-exaggeration':   0.6
                }
            }, firstSymbolId || undefined);
        }

        function toggleTerrain(enabled) {
            terrainEnabled = enabled;
            if (!styleReady) return;
            try {
                if (enabled) {
                    map.setTerrain({ source: '_terrain_dem', exaggeration: 1.4 });
                    map.setLayoutProperty('_hillshade', 'visibility', 'visible');
                } else {
                    map.setTerrain(null);
                    map.setLayoutProperty('_hillshade', 'visibility', 'none');
                }
            } catch(e) {}
        }

        /* ── 2D / 3D view ── */
        function setView2D() {
            document.getElementById('btn-2d').classList.add('active');
            document.getElementById('btn-3d').classList.remove('active');
            map.easeTo({ pitch: 0, bearing: 0, duration: 600 });
        }

        function setView3D() {
            document.getElementById('btn-3d').classList.add('active');
            document.getElementById('btn-2d').classList.remove('active');
            map.easeTo({ pitch: 55, bearing: -20, duration: 700 });
        }

        /* ── Position marker (GeoJSON) ── */
        let currentPos = { lng: INIT_CENTER[0], lat: INIT_CENTER[1] };

        function addPositionLayer() {
            map.addSource('_position', {
                type: 'geojson',
                data: positionGeoJSON(currentPos.lat, currentPos.lng)
            });
            map.addSource('_accuracy', {
                type: 'geojson',
                data: accuracyGeoJSON(currentPos.lat, currentPos.lng, 0)
            });

            map.addLayer({
                id: '_accuracy_fill',
                source: '_accuracy',
                type: 'fill',
                paint: { 'fill-color': '#d8c96a', 'fill-opacity': 0.12 }
            });
            map.addLayer({
                id: '_accuracy_ring',
                source: '_accuracy',
                type: 'line',
                paint: { 'line-color': '#d8c96a', 'line-width': 1, 'line-opacity': 0.6 }
            });
            map.addLayer({
                id: '_position_dot',
                source: '_position',
                type: 'circle',
                paint: {
                    'circle-radius': 8,
                    'circle-color': '#83d099',
                    'circle-stroke-color': '#d8c96a',
                    'circle-stroke-width': 2,
                    'circle-opacity': 0.95
                }
            });
        }

        function positionGeoJSON(lat, lng) {
            return { type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] } };
        }

        function accuracyGeoJSON(lat, lng, radiusMeters) {
            if (!radiusMeters || radiusMeters <= 1) {
                return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [[]] } };
            }
            const pts = 64;
            const coords = [];
            const earthR = 6371000;
            const dLat = (radiusMeters / earthR) * (180 / Math.PI);
            const dLng = dLat / Math.cos(lat * Math.PI / 180);
            for (let i = 0; i <= pts; i++) {
                const angle = (i / pts) * 2 * Math.PI;
                coords.push([lng + dLng * Math.cos(angle), lat + dLat * Math.sin(angle)]);
            }
            return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } };
        }

        /* ── TDOA ellipse GeoJSON helpers ── */

        function ellipseRing(lat, lng, a_m, b_m, theta_deg, pts) {
            pts = pts || 64;
            const earthR = 6371000;
            const thetaRad = (theta_deg || 0) * Math.PI / 180;
            const coords = [];
            for (let i = 0; i <= pts; i++) {
                const angle = (i / pts) * 2 * Math.PI;
                const ex = a_m * Math.cos(angle) * Math.cos(thetaRad)
                          - b_m * Math.sin(angle) * Math.sin(thetaRad);
                const ny = a_m * Math.cos(angle) * Math.sin(thetaRad)
                          + b_m * Math.sin(angle) * Math.cos(thetaRad);
                const dLat = (ny / earthR) * (180 / Math.PI);
                const dLng = (ex / earthR) * (180 / Math.PI) / Math.cos(lat * Math.PI / 180);
                coords.push([lng + dLng, lat + dLat]);
            }
            return coords;
        }

        /* ── KrakenSDR LOB GeoJSON helpers ── */

        // Bearing wedge polygon: a fan from node position, ±halfAngle,
        // to rangeM.  Returns a [lon, lat] coordinate ring (closed).
        function lobWedgeRing(nodeLat, nodeLon, bearingDeg, halfAngleDeg, rangeM, pts) {
            pts = pts || 24;
            const earthR = 6371000;
            const coords = [[nodeLon, nodeLat]];   // apex at node
            const startDeg = bearingDeg - halfAngleDeg;
            const endDeg   = bearingDeg + halfAngleDeg;
            for (let i = 0; i <= pts; i++) {
                const angleDeg = startDeg + (endDeg - startDeg) * (i / pts);
                const angleRad = angleDeg * Math.PI / 180;
                const ex = rangeM * Math.sin(angleRad);      // east
                const ny = rangeM * Math.cos(angleRad);      // north
                const dLat = (ny / earthR) * (180 / Math.PI);
                const dLon = (ex / earthR) * (180 / Math.PI) / Math.cos(nodeLat * Math.PI / 180);
                coords.push([nodeLon + dLon, nodeLat + dLat]);
            }
            coords.push([nodeLon, nodeLat]);   // close polygon
            return coords;
        }

        function tracksToLOBWedgeGeoJSON(tracks) {
            const features = [];
            for (const t of tracks) {
                if (t.lob_bearing_deg == null) continue;
                const nLat = t.lob_node_lat;
                const nLon = t.lob_node_lon;
                if (!nLat || !nLon) continue;
                const halfAngle = Math.max(2, (t.lob_bearing_uncert_deg || 10) * 1.0);
                features.push({
                    type: 'Feature',
                    properties: {
                        emitter_id:  t.emitter_id,
                        threat_level: t.threat_level || 'unknown',
                        bearing_deg: t.lob_bearing_deg,
                        confidence:  t.lob_confidence || 0,
                    },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [lobWedgeRing(nLat, nLon, t.lob_bearing_deg, halfAngle, 25000)]
                    }
                });
            }
            return { type: 'FeatureCollection', features };
        }

        function tracksToLOBCrosscut(tracks) {
            const features = [];
            for (const t of tracks) {
                if (t.lob_crosscut_lat == null || t.lob_crosscut_lon == null) continue;
                const r = t.lob_crosscut_radius_m || 300;
                features.push({
                    type: 'Feature',
                    properties: {
                        emitter_id:  t.emitter_id,
                        threat_level: t.threat_level || 'unknown',
                        confidence:  t.lob_crosscut_confidence || 0,
                    },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [ellipseRing(t.lob_crosscut_lat, t.lob_crosscut_lon, r, r, 0)]
                    }
                });
            }
            return { type: 'FeatureCollection', features };
        }

        function toggleLOBLayers(visible) {
            if (!styleReady) return;
            ['_lob_wedge_fill', '_lob_wedge_stroke'].forEach(id => {
                try { map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none'); } catch(e) {}
            });
        }

        function toggleLOBCrosscut(visible) {
            if (!styleReady) return;
            ['_lob_crosscut_fill', '_lob_crosscut_ring'].forEach(id => {
                try { map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none'); } catch(e) {}
            });
        }

        function tracksToEllipseGeoJSON(tracks) {
            const features = [];
            for (const t of tracks) {
                if (!t.estimated_lat || !t.estimated_lon) continue;
                if (t.location_method !== 'tdoa') continue;
                const lat = t.estimated_lat, lng = t.estimated_lon;
                const a = t.tdoa_ellipse_a_m || t.location_error_radius_m || 200;
                const b = t.tdoa_ellipse_b_m || a;
                const theta = t.tdoa_ellipse_theta_deg || 0;
                features.push({
                    type: 'Feature',
                    properties: { emitter_id: t.emitter_id, threat_level: t.threat_level || 'unknown' },
                    geometry: { type: 'Polygon', coordinates: [ellipseRing(lat, lng, a, b, theta)] }
                });
            }
            return { type: 'FeatureCollection', features };
        }

        function tracksToProximityGeoJSON(tracks) {
            const features = [];
            for (const t of tracks) {
                if (!t.estimated_lat || !t.estimated_lon) continue;
                if (t.location_method !== 'rssi_proximity') continue;
                const r = t.location_error_radius_m || 500;
                features.push({
                    type: 'Feature',
                    properties: { emitter_id: t.emitter_id, threat_level: t.threat_level || 'unknown' },
                    geometry: { type: 'Polygon', coordinates: [ellipseRing(t.estimated_lat, t.estimated_lon, r, r, 0)] }
                });
            }
            return { type: 'FeatureCollection', features };
        }

        function trackDotGeoJSON(tracks) {
            const features = [];
            for (const t of tracks) {
                if (!t.estimated_lat || !t.estimated_lon) continue;
                features.push({
                    type: 'Feature',
                    properties: {
                        emitter_id: t.emitter_id,
                        threat_level: t.threat_level || 'unknown',
                        freq_mhz: t.primary_frequency ? (t.primary_frequency / 1e6).toFixed(3) : '',
                        nominated: t.is_nominated_target ? 1 : 0,
                    },
                    geometry: { type: 'Point', coordinates: [t.estimated_lon, t.estimated_lat] }
                });
            }
            return { type: 'FeatureCollection', features };
        }

        function addEmitterLayers() {
            map.addSource('_tdoa_ellipses', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addSource('_prox_circles', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addSource('_lob_wedges',   { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addSource('_lob_crosscut', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addSource('_emitter_dots', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addSource('_fleet_peers',  { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

            map.addLayer({ id: '_tdoa_fill', source: '_tdoa_ellipses', type: 'fill',
                paint: { 'fill-color': ['match', ['get', 'threat_level'],
                    'critical', '#ff3b3b', 'high', '#ff8c00', 'medium', '#d8c96a', 'low', '#83d099', '#7a9e7e'],
                    'fill-opacity': 0.15 } });
            map.addLayer({ id: '_tdoa_ring', source: '_tdoa_ellipses', type: 'line',
                paint: { 'line-color': ['match', ['get', 'threat_level'],
                    'critical', '#ff3b3b', 'high', '#ff8c00', 'medium', '#d8c96a', 'low', '#83d099', '#7a9e7e'],
                    'line-width': 1.5, 'line-opacity': 0.8 } });
            map.addLayer({ id: '_prox_fill', source: '_prox_circles', type: 'fill',
                paint: { 'fill-color': '#d8c96a', 'fill-opacity': 0.08 } });
            map.addLayer({ id: '_prox_ring', source: '_prox_circles', type: 'line',
                paint: { 'line-color': '#d8c96a', 'line-width': 1, 'line-opacity': 0.5,
                    'line-dasharray': [4, 3] } });

            // LOB bearing wedges — semi-transparent fan from array to 25 km
            map.addLayer({ id: '_lob_wedge_fill', source: '_lob_wedges', type: 'fill',
                paint: { 'fill-color': ['match', ['get', 'threat_level'],
                    'critical', '#ff3b3b', 'high', '#ff8c00', 'medium', '#d8c96a', 'low', '#83d099', '#7a9e7e'],
                    'fill-opacity': 0.10 } });
            map.addLayer({ id: '_lob_wedge_stroke', source: '_lob_wedges', type: 'line',
                paint: { 'line-color': ['match', ['get', 'threat_level'],
                    'critical', '#ff3b3b', 'high', '#ff8c00', 'medium', '#d8c96a', 'low', '#83d099', '#7a9e7e'],
                    'line-width': 1.0, 'line-opacity': 0.55,
                    'line-dasharray': [6, 3] } });

            // LOB crosscut circles — magenta to distinguish from TDOA (cyan) + RSSI (yellow)
            map.addLayer({ id: '_lob_crosscut_fill', source: '_lob_crosscut', type: 'fill',
                paint: { 'fill-color': '#e040fb', 'fill-opacity': 0.12 } });
            map.addLayer({ id: '_lob_crosscut_ring', source: '_lob_crosscut', type: 'line',
                paint: { 'line-color': '#e040fb', 'line-width': 1.5, 'line-opacity': 0.75,
                    'line-dasharray': [4, 2] } });

            map.addLayer({ id: '_emitter_dots_layer', source: '_emitter_dots', type: 'circle',
                paint: { 'circle-radius': 6,
                    'circle-color': ['match', ['get', 'threat_level'],
                        'critical', '#ff3b3b', 'high', '#ff8c00', 'medium', '#d8c96a', 'low', '#83d099', '#7a9e7e'],
                    'circle-stroke-color': '#0b0e0a', 'circle-stroke-width': 1.5, 'circle-opacity': 0.92 } });
            // Nominated mission target — double red ring under the dot so
            // the designated target is unmistakable among emitter markers.
            map.addLayer({ id: '_nominated_ring_outer', source: '_emitter_dots', type: 'circle',
                filter: ['==', ['get', 'nominated'], 1],
                paint: { 'circle-radius': 14, 'circle-color': 'rgba(0,0,0,0)',
                    'circle-stroke-color': '#ff3b3b', 'circle-stroke-width': 2, 'circle-stroke-opacity': 0.9 } });
            map.addLayer({ id: '_nominated_ring_inner', source: '_emitter_dots', type: 'circle',
                filter: ['==', ['get', 'nominated'], 1],
                paint: { 'circle-radius': 10, 'circle-color': 'rgba(0,0,0,0)',
                    'circle-stroke-color': '#ff3b3b', 'circle-stroke-width': 1, 'circle-stroke-opacity': 0.6 } });
            map.addLayer({ id: '_emitter_labels', source: '_emitter_dots', type: 'symbol',
                layout: { 'text-field': ['get', 'freq_mhz'],
                    'text-font': ['literal', ['Noto Sans Regular']],
                    'text-size': 10, 'text-offset': [0, 1.2], 'text-anchor': 'top' },
                paint: { 'text-color': '#b0c8b4', 'text-halo-color': '#0b0e0a', 'text-halo-width': 1 } });

            // Fleet peer markers — amber diamonds (circle w/ heavy stroke)
            // so friendly units read differently from emitter dots.
            map.addLayer({ id: '_fleet_peer_dots', source: '_fleet_peers', type: 'circle',
                paint: { 'circle-radius': 8, 'circle-color': '#f2a733',
                    'circle-stroke-color': '#0b0e0a', 'circle-stroke-width': 2.5,
                    'circle-opacity': 0.95 } });
            map.addLayer({ id: '_fleet_peer_labels', source: '_fleet_peers', type: 'symbol',
                layout: { 'text-field': ['get', 'label'],
                    'text-font': ['literal', ['Noto Sans Regular']],
                    'text-size': 11, 'text-offset': [0, 1.3], 'text-anchor': 'top' },
                paint: { 'text-color': '#f2a733', 'text-halo-color': '#0b0e0a', 'text-halo-width': 1.2 } });
        }

        map.on('load', () => {
            styleReady = true;
            discoverLayers();
            addPositionLayer();
            add3DBuildingLayer();
            addEmitterLayers();
            addTerrain();

            // Force the canvas to match the container's true pixel size.
            // MapLibre may have initialised inside an iframe before the flex
            // layout had settled, resulting in a canvas that is narrower than
            // the element (the classic "tiles only on the left half" bug).
            map.resize();

            // Notify the parent CoC dashboard that the map is ready
            // so it can flush queued track-update messages.
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'predator-map-ready' }, '*');
            }
        });

        // Keep the canvas in sync whenever the iframe is resized (e.g. the
        // dashboard grid re-flows at breakpoints or the browser window resizes).
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(() => { try { map.resize(); } catch(e) {} })
                .observe(document.getElementById('map'));
        }

        /* ── Dashboard postMessage bridge ── */
        // Receives track updates from the parent CoC dashboard and forwards
        // them into the existing PredatorRFMap.updateTracks() API so the
        // same GeoJSON pipeline renders emitter markers on the map.
        //
        // Supported message types:
        //   predator-tracks-bulk  { tracks: [...] }  — full batch update
        //   predator-track-update { ... }             — single event (node
        //       location, used to build a minimal track entry per emitter)
        //
        // After map load we notify the parent with predator-map-ready so
        // the dashboard can flush its queued updates immediately.
        const _emitterCache = {};   // emitter_key → track-like dict

        window.addEventListener('message', function(ev) {
            if (!styleReady) return;
            const msg = ev.data;
            if (!msg || typeof msg !== 'object') return;

            if (msg.type === 'predator-tracks-bulk' && Array.isArray(msg.tracks)) {
                window.PredatorRFMap.updateTracks(msg.tracks);
                return;
            }

            if (msg.type === 'predator-track-update') {
                // Single event from raw SSE: build/update a minimal track
                // entry so emitter_dots layer gets a dot at node position.
                if (!msg.lat && !msg.lon) return;
                const key = (msg.node_id || '') + ':' + Math.round((msg.frequency || 0) / 25000) * 25000;
                const existing = _emitterCache[key] || {};
                _emitterCache[key] = Object.assign(existing, {
                    emitter_id:       key,
                    primary_frequency: msg.frequency,
                    estimated_lat:    msg.lat,
                    estimated_lon:    msg.lon,
                    threat_level:     msg.threat_level || 'unknown',
                    location_method:  'rssi_proximity',
                    location_error_radius_m: 500,
                });
                window.PredatorRFMap.updateTracks(Object.values(_emitterCache));
                return;
            }
        });

        /* ── Android bridge ── */
        window.PredatorRFMap = {
            updatePosition(lat, lon, accuracy, follow) {
                currentPos = { lat, lng: lon };
                if (!styleReady) return;
                try {
                    map.getSource('_position').setData(positionGeoJSON(lat, lon));
                    map.getSource('_accuracy').setData(accuracyGeoJSON(lat, lon, accuracy || 0));
                } catch(e) {}
                if (follow) {
                    map.easeTo({
                        center: [lon, lat],
                        zoom: Math.max(map.getZoom(), 15),
                        duration: 300
                    });
                }
            },

            updatePeers(peersJson) {
                if (!styleReady) return;
                let peers;
                try { peers = typeof peersJson === 'string' ? JSON.parse(peersJson) : peersJson; }
                catch(e) { return; }
                if (!Array.isArray(peers)) return;
                const feats = peers
                    .filter(p => typeof p.lat === 'number' && typeof p.lon === 'number')
                    .map(p => ({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [p.lon, p.lat] },
                        properties: {
                            label: (p.name || 'peer') + (p.role ? ' [' + p.role + ']' : ''),
                            accuracy: p.accuracy || 0
                        }
                    }));
                try {
                    map.getSource('_fleet_peers').setData({ type: 'FeatureCollection', features: feats });
                } catch(e) {}
            },

            updateTracks(tracksJson) {
                if (!styleReady) return;
                let tracks;
                try { tracks = typeof tracksJson === 'string' ? JSON.parse(tracksJson) : tracksJson; }
                catch(e) { return; }
                if (!Array.isArray(tracks)) return;
                try {
                    map.getSource('_tdoa_ellipses').setData(tracksToEllipseGeoJSON(tracks));
                    map.getSource('_prox_circles').setData(tracksToProximityGeoJSON(tracks));
                    map.getSource('_lob_wedges').setData(tracksToLOBWedgeGeoJSON(tracks));
                    map.getSource('_lob_crosscut').setData(tracksToLOBCrosscut(tracks));
                    map.getSource('_emitter_dots').setData(trackDotGeoJSON(tracks));
                } catch(e) {}
            }
        };
    </script>
</body>
</html>
